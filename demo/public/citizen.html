<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#187535">
<title>بلّغ — تطبيق المواطن</title>
<link rel="icon" href="/brand/ballegh-mark.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link href="/css/app.css" rel="stylesheet">
<style>
  body { background:#E6ECE8; }
  .device { width:100%; max-width:420px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative; display:flex; flex-direction:column; }
  @media (min-width:600px) { body { padding:24px 0; } .device { min-height:calc(100vh - 48px); height:860px; max-height:calc(100vh - 48px); border-radius:38px; border:10px solid #16211A; box-shadow:0 30px 60px rgb(0 0 0/.25); overflow:hidden; } }
  .screen { flex:1; overflow-y:auto; display:flex; flex-direction:column; }
  .appbar { display:flex; align-items:center; gap:10px; padding:14px 16px; background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:5; }
  .appbar h1 { font-size:18px; margin:0; font-weight:600; }
  .pad { padding:16px; }
  .hero { background:linear-gradient(160deg,#187535,#135F2B); color:#fff; padding:22px 18px 26px; }
  .hero h2 { margin:6px 0 4px; font-size:22px; }
  .hero p { margin:0; opacity:.85; font-size:14px; }
  .bigcta { display:flex; align-items:center; gap:12px; background:var(--surface); color:var(--text); border-radius:18px; padding:16px; margin:-18px 16px 0; box-shadow:var(--sh-md); border:0; width:calc(100% - 32px); cursor:pointer; text-align:right; }
  .bigcta .ic { width:52px; height:52px; border-radius:14px; background:var(--primary); color:#fff; display:grid; place-items:center; flex:none; }
  .bigcta b { font-size:18px; display:block; }
  .emerg { display:flex; align-items:center; justify-content:center; gap:8px; margin:12px 16px 0; background:#FDECEC; color:#B91C1C; border:1px solid #F6C1C1; border-radius:14px; padding:12px; font-weight:600; cursor:pointer; width:calc(100% - 32px); }
  .cats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .cat { background:var(--surface); border:1.5px solid var(--border); border-radius:16px; padding:14px 6px 10px; text-align:center; cursor:pointer; font-size:13px; line-height:1.35; display:grid; justify-items:center; gap:8px; min-height:104px; }
  .cat .ci { width:44px; height:44px; border-radius:12px; display:grid; place-items:center; background:var(--primary-soft); color:var(--primary); }
  .cat.emergency .ci { background:#FDECEC; color:#DC2626; }
  .cat.sel { border-color:var(--primary); background:var(--primary-soft); }
  .steps { display:flex; gap:6px; padding:10px 16px 0; }
  .steps i { flex:1; height:4px; border-radius:4px; background:var(--border); }
  .steps i.on { background:var(--primary); }
  .footer-cta { padding:12px 16px 18px; background:var(--surface); border-top:1px solid var(--border); position:sticky; bottom:0; }
  .thumbs { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .thumbs .th { position:relative; aspect-ratio:1; border-radius:12px; overflow:hidden; background:var(--surface-2); }
  .thumbs .th img, .thumbs .th video { width:100%; height:100%; object-fit:cover; }
  .thumbs .th button { position:absolute; top:4px; left:4px; width:26px; height:26px; border-radius:50%; border:0; background:rgb(0 0 0/.55); color:#fff; cursor:pointer; display:grid; place-items:center; }
  .thumbs .th .g { position:absolute; bottom:4px; right:4px; font-size:10px; background:rgb(0 0 0/.55); color:#fff; padding:1px 6px; border-radius:6px; }
  .addmedia { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .addmedia label, .addmedia button { display:grid; justify-items:center; gap:4px; padding:12px 4px; border:1.5px dashed var(--border); border-radius:14px; background:var(--surface); color:var(--primary); font-size:12px; font-weight:500; cursor:pointer; }
  .addmedia input { display:none; }
  #pickMap { height:300px; border-radius:16px; overflow:hidden; border:1px solid var(--border); }
  .locbox { display:flex; gap:10px; align-items:flex-start; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px; }
  .locbox.ok { border-color:var(--green-100); background:var(--primary-soft); }
  .locbox.bad { border-color:#F6C1C1; background:#FDECEC; }
  .myr { display:grid; grid-template-columns:56px 1fr; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:10px; cursor:pointer; }
  .myr img { width:56px; height:56px; border-radius:10px; object-fit:cover; }
  .success { text-align:center; padding:40px 20px; display:grid; gap:10px; justify-items:center; }
  .success .ok { width:84px; height:84px; border-radius:50%; background:var(--primary-soft); color:var(--primary); display:grid; place-items:center; }
  .code { font-size:26px; font-weight:700; letter-spacing:1px; direction:ltr; }
  .stars { display:flex; gap:6px; justify-content:center; direction:ltr; }
  .stars button { font-size:34px; border:0; background:none; cursor:pointer; color:#D9E1DB; line-height:1; }
  .stars button.on { color:var(--gold-500); }
  .rec { display:flex; align-items:center; gap:10px; }
  .rec .dotrec { width:10px; height:10px; border-radius:50%; background:#DC2626; animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:.2; } }
  .offline { background:#16211A; color:#fff; text-align:center; font-size:13px; padding:6px; }
  .otp { display:flex; gap:8px; direction:ltr; justify-content:center; }
  .otp input { width:56px; height:60px; text-align:center; font-size:26px; font-weight:700; border:1.5px solid var(--border); border-radius:12px; }
  .sso { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .lang { position:absolute; top:14px; left:16px; }
  /* ---- guided chat ---- */
  .chatcta { margin-top:10px; }
  .chatcta .ic { background:var(--gold-500); color:#3B2600; }
  .chatwrap { flex:1; display:flex; flex-direction:column; min-height:0; }
  .chatlog { flex:1; overflow-y:auto; padding:14px 12px 10px; display:flex; flex-direction:column; gap:8px; background:#EAF1EC; background-image:radial-gradient(circle at 1px 1px, rgb(24 117 53/.06) 1px, transparent 0); background-size:18px 18px; }
  .msg { max-width:86%; padding:9px 13px; border-radius:16px; font-size:15px; line-height:1.7; box-shadow:0 1px 1.5px rgb(0 0 0/.06); animation:mpop .18s ease-out; word-wrap:break-word; }
  @keyframes mpop { from { opacity:0; transform:translateY(6px); } }
  .msg.bot { align-self:flex-start; background:#fff; border-start-start-radius:4px; }
  .msg.me { align-self:flex-end; background:var(--primary); color:#fff; border-start-end-radius:4px; }
  .msg.me audio { display:block; margin-top:6px; max-width:220px; height:34px; }
  .msg a { color:var(--primary); font-weight:600; }
  .msg.typing { display:flex; gap:4px; padding:13px 15px; }
  .msg.typing i { width:7px; height:7px; border-radius:50%; background:#9AAB9F; animation:tdot 1s infinite; }
  .msg.typing i:nth-child(2) { animation-delay:.15s; } .msg.typing i:nth-child(3) { animation-delay:.3s; }
  @keyframes tdot { 0%,60%,100% { opacity:.3; transform:none; } 30% { opacity:1; transform:translateY(-3px); } }
  .chips { display:flex; flex-wrap:wrap; gap:6px; align-self:flex-start; max-width:96%; animation:mpop .2s ease-out; }
  .chip { border:1.5px solid var(--primary); color:var(--primary); background:#fff; border-radius:999px; padding:7px 14px; font:inherit; font-size:14px; cursor:pointer; }
  .chip:hover { background:var(--primary-soft); }
  .chip.primary { background:var(--primary); color:#fff; }
  .chip.danger { border-color:#DC2626; color:#B91C1C; }
  .chatbar { display:flex; gap:6px; align-items:center; padding:8px 10px calc(8px + env(safe-area-inset-bottom)); background:#fff; border-top:1px solid var(--border); }
  .chatbar input { flex:1; min-width:0; height:44px; border:1px solid var(--border); border-radius:999px; padding:0 16px; font:inherit; font-size:15px; outline:none; background:var(--surface-2); }
  .chatbar input:focus { border-color:var(--primary); background:#fff; }
  .chatbar input:disabled { opacity:.6; }
  .chatbar .cb { width:44px; height:44px; flex:none; border-radius:50%; border:0; display:grid; place-items:center; background:var(--surface-2); color:var(--primary); cursor:pointer; }
  .chatbar .cb.send { background:var(--primary); color:#fff; }
  .chatbar .cb:disabled { opacity:.4; cursor:default; }
  .chatbar .cb.rec { background:#DC2626; color:#fff; animation:blink 1s infinite; }
  .mthumbs { display:grid; grid-template-columns:repeat(3,64px); gap:4px; }
  .mthumbs img, .mthumbs video { width:64px; height:64px; object-fit:cover; border-radius:10px; display:block; }
  .mthumbs.sm { grid-template-columns:repeat(5,40px); margin:4px 0; }
  .mthumbs.sm img, .mthumbs .vt { width:40px; height:40px; border-radius:8px; object-fit:cover; display:grid; place-items:center; background:var(--surface-2); }
  .sumcard { display:grid; gap:6px; min-width:230px; }
  .sumcard .st { font-weight:700; color:var(--primary); margin-bottom:2px; }
  .sumcard .sr { display:grid; grid-template-columns:22px 1fr; gap:6px; font-size:14px; line-height:1.55; }
  .emgl { display:grid; gap:6px; margin:8px 0 6px; }
  .emgl a { display:flex; justify-content:space-between; gap:10px; background:#FDECEC; color:#991B1B !important; border:1px solid #F6C1C1; border-radius:12px; padding:8px 12px; text-decoration:none; }
  .mylist { display:grid; gap:6px; margin-top:6px; }
  .mylist a { display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:var(--surface-2); border-radius:10px; padding:8px 10px; text-decoration:none; color:var(--text) !important; font-weight:400; }
  .csep { align-self:center; font-size:12px; color:var(--muted); background:rgb(255 255 255/.7); border-radius:999px; padding:3px 12px; margin:6px 0; }
  .sheet { position:absolute; inset:0; background:rgb(14 21 17/.45); z-index:50; display:flex; align-items:flex-end; }
  .sheet .sh { background:#fff; width:100%; border-radius:20px 20px 0 0; padding:14px; display:grid; gap:10px; animation:mpop .2s ease-out; }
  #smap { height:320px; border-radius:14px; overflow:hidden; }
  .bellb { position:relative; }
  .nbadge { position:absolute; top:-5px; inset-inline-start:-5px; min-width:18px; height:18px; padding:0 5px; border-radius:999px; background:#D92D20; color:#fff; font-size:11px; font-weight:700; display:grid; place-items:center; line-height:1; border:2px solid var(--green-500); }
  .nbadge:empty { display:none; }
  .nlist { display:grid; gap:8px; }
  .nitem { display:grid; grid-template-columns:38px 1fr; gap:10px; align-items:start; background:#fff; border:1px solid var(--border); border-radius:14px; padding:10px 12px; text-decoration:none; color:var(--text) !important; font-weight:400; }
  .nitem.unread { background:#F1F8F3; border-color:#BFE0C8; }
  .nitem .ni { width:38px; height:38px; border-radius:12px; display:grid; place-items:center; font-size:18px; background:var(--surface-2); }
  .nitem.announce .ni { background:#FFF4DB; }
  .nitem b { display:block; font-size:14px; }
  .nitem .nb { font-size:13px; color:var(--text-2, #3d4a42); margin-top:2px; }
  .nitem .nt { font-size:11px; color:var(--muted); margin-top:4px; }
  .nitem.unread b::after { content:''; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--green-500); margin-inline-start:6px; vertical-align:middle; }
  .pushcard { display:flex; gap:10px; align-items:center; background:#FFF8E6; border:1px solid #F3D99A; border-radius:14px; padding:10px 12px; margin:10px 16px 0; }
  .pushcard .spacer { flex:1; }
  .pref { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
  .pref:last-child { border-bottom:0; }
  .pref > div { flex:1; }
  .pref .small { margin-top:2px; }
  .switch { position:relative; width:46px; height:26px; flex:none; }
  .switch input { opacity:0; width:0; height:0; position:absolute; }
  .switch i { position:absolute; inset:0; background:#CBD5D0; border-radius:999px; transition:background .15s; }
  .switch i::after { content:''; position:absolute; top:3px; inset-inline-start:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:transform .15s; box-shadow:0 1px 3px rgb(0 0 0/.25); }
  .switch input:checked + i { background:var(--green-500); }
  .switch input:checked + i::after { transform:translateX(-20px); }
  .switch input:focus-visible + i { outline:2px solid var(--green-700); outline-offset:2px; }
</style>
</head>
<body>
<div class="device">
  <div id="offline" class="offline hidden">أنت غير متصل — البلاغات هتتحفظ وتتبعت أول ما النت يرجع</div>
  <div class="screen" id="app"></div>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script type="module">
import { api, meta, useUser, getUser, setUser, toast, esc, dt, ago, statusBadge, priorityBadge, timeline, gallery, catAr, statusAr, slaBar } from '/js/common.js';
import { icon } from '/js/icons.js';
import { createMap } from '/js/map.js';

const $app = document.getElementById('app');
let M, user = getUser('citizen');
const draft = { category: null, files: [], description: '', answers: {}, audio: null, loc: null, locInfo: null, gps: null };
const QUEUE_KEY = 'ballegh:queue';

function render(html) { $app.innerHTML = html; $app.scrollTop = 0; $app.classList.remove('scr-in'); void $app.offsetWidth; $app.classList.add('scr-in'); }
function appbar(title, back) { return `<div class="appbar">${back ? `<button class="icon-btn" data-back aria-label="رجوع">${icon('back', 20)}</button>` : ''}<h1>${esc(title)}</h1><span class="spacer"></span></div>`; }
$app.addEventListener('click', e => { if (e.target.closest('[data-back]')) history.back(); });

// --- simple hash router ---
const routes = { '': home, login, new: step1, media: step2, location: step3, done: doneScreen, report: reportScreen, chat: chatScreen, notifs: notifsScreen, settings: settingsScreen };
window.addEventListener('hashchange', route);
function go(h) { location.hash = h; }
function route() {
  const [name, arg] = location.hash.slice(1).split('/');
  if (!user && name !== 'login') return go('login');
  (routes[name] || home)(arg);
}

// ---------- login ----------
function login() {
  render(`<div class="pad" style="padding-top:48px;display:grid;gap:18px">
    <div style="text-align:center"><img src="/brand/ballegh-mark.svg" width="84" alt=""><h2 style="margin:8px 0 0;font-size:30px;color:var(--green-500)">بلّغ</h2><div class="muted small">منصة بلاغات محافظة الفيوم</div></div>
    <div id="lstep"></div></div>`);
  const box = document.getElementById('lstep');
  const phoneStep = () => {
    box.innerHTML = `<div class="stack"><label class="field"><span>رقم الموبايل</span><input class="input num" id="phone" inputmode="tel" placeholder="01xxxxxxxxx" dir="ltr" style="text-align:right;font-size:18px"></label>
      <label class="field"><span>الاسم</span><input class="input" id="nm" placeholder="الاسم بالكامل"></label>
      <button class="btn lg block" id="send">إرسال كود التحقق</button>
      <div class="row muted small" style="justify-content:center">أو سجّل دخول بـ</div>
      <div class="sso"><button class="btn ghost" data-sso>Google</button><button class="btn ghost" data-sso>Microsoft</button></div>
      <div class="hint">في كل الحالات تأكيد رقم الموبايل بكود OTP إلزامي، ومفيش بلاغات مجهولة. <b>للعرض:</b> الكود هو 1234.</div>
      <button class="btn secondary block" id="demo">دخول سريع بحساب تجريبي</button></div>`;
    box.querySelector('#send').onclick = async () => {
      try { const phone = box.querySelector('#phone').value; await api('/api/auth/otp', { method: 'POST', body: { phone } }); otpStep(phone, box.querySelector('#nm').value); } catch (e) { toast(e.message, 'err'); }
    };
    box.querySelectorAll('[data-sso]').forEach(b => b.onclick = () => toast('في النظام الفعلي: دخول بالحساب ثم تأكيد رقم الموبايل بكود OTP'));
    box.querySelector('#demo').onclick = () => { user = { id: 'c-demo', name: 'مواطن تجريبي', phone: '01000000000' }; setUser(user, 'citizen'); go(''); };
  };
  const otpStep = (phone, name) => {
    box.innerHTML = `<div class="stack" style="text-align:center"><div>أدخل الكود المرسل إلى <b class="num" dir="ltr">${esc(phone)}</b></div>
      <div class="otp">${[0, 1, 2, 3].map(() => '<input maxlength="1" inputmode="numeric">').join('')}</div>
      <button class="btn lg block" id="verify">تأكيد</button><div class="muted small">للعرض: 1234</div></div>`;
    const ins = [...box.querySelectorAll('.otp input')];
    ins.forEach((i, k) => i.addEventListener('input', () => { if (i.value && ins[k + 1]) ins[k + 1].focus(); }));
    ins[0].focus();
    box.querySelector('#verify').onclick = async () => {
      try { user = await api('/api/auth/verify', { method: 'POST', body: { phone, code: ins.map(i => i.value).join(''), name } }); setUser(user, 'citizen'); go(''); } catch (e) { toast(e.message, 'err'); }
    };
  };
  phoneStep();
}

// ---------- home ----------
async function home() {
  useUser(user.id);
  render(`<div class="hero"><div class="row"><img src="/brand/ballegh-mark.svg" width="30" style="filter:brightness(0) invert(1)" alt=""><b style="font-size:20px">بلّغ</b><span class="spacer"></span><button class="icon-btn bellb" id="bell" style="background:transparent;border-color:rgb(255 255 255/.3);color:#fff" aria-label="الإشعارات">${icon('bell', 18)}<span class="nbadge" id="nbadge"></span></button><button class="icon-btn" id="logout" style="background:transparent;border-color:rgb(255 255 255/.3);color:#fff" aria-label="خروج">${icon('logout', 18)}</button></div>
      <h2>أهلاً ${esc(user.name || '')}</h2><p>صوّر المشكلة، والوحدة المحلية المختصة هتستلمها فوراً.</p></div>
    <div id="pushSlot"></div>
    <button class="bigcta" id="new"><span class="ic">${icon('plus', 28)}</span><span><b>بلاغ جديد</b><span class="muted small">3 خطوات بس: النوع، الصور، الموقع</span></span></button>
    <button class="bigcta chatcta" id="chatGo"><span class="ic">${icon('chat', 26)}</span><span><b>بلّغ بالمحادثة</b><span class="muted small">اكتب أو اتكلم، والمساعد يكمّل معاك</span></span></button>
    <button class="emerg" id="emerg">${icon('alert', 20)} بلاغ طوارئ (حريق / انهيار)</button>
    <div class="pad"><div class="row"><h3 style="margin:8px 0;font-size:16px">بلاغاتي</h3><span class="spacer"></span><span class="muted small" id="cnt"></span></div><div class="stack" id="mine"><div class="muted small">جاري التحميل…</div></div></div>`);
  document.getElementById('new').onclick = () => { resetDraft(); go('new'); };
  document.getElementById('chatGo').onclick = () => go('chat');
  document.getElementById('emerg').onclick = () => { resetDraft(); draft.category = 'emergency'; emergencySheet(); };
  document.getElementById('logout').onclick = () => { setUser(null, 'citizen'); user = null; go('login'); };
  document.getElementById('bell').onclick = () => go('notifs');
  joinRoom(); refreshBadge(); pushPrompt();
  const queued = getQueue();
  try {
    const list = await api('/api/reports');
    document.getElementById('cnt').textContent = `${list.length} بلاغ`;
    document.getElementById('mine').innerHTML = (queued.map(q => `<div class="myr" style="opacity:.75"><div style="display:grid;place-items:center;background:var(--surface-2);border-radius:10px">${icon('bell')}</div><div><b>${esc(catAr(q.category))}</b><div class="small muted">في الانتظار — هيتبعت أول ما النت يرجع</div></div></div>`).join('')) +
      (list.length ? list.map(r => `<div class="myr" data-id="${r.id}"><img src="${esc(r.thumb || '/img/placeholder/other.svg')}" alt=""><div><div class="row"><b style="font-size:14px">${esc(catAr(r.category))}</b><span class="spacer"></span>${statusBadge(r.status)}</div>
        <div class="small muted">${esc(r.villageName || r.noUnitArea || '')} · <span class="num" dir="ltr">${esc(r.code)}</span></div><div class="tiny muted">${ago(r.createdAt)}${r.isDuplicate ? ' · تم ضمه لبلاغ سابق' : ''}${r.status === 'RESOLVED' && !r.rated ? ' · <b style="color:var(--gold-700)">قيّم الحل</b>' : ''}</div></div></div>`).join('')
        : '<div class="card muted small" style="text-align:center">لسه مقدمتش بلاغات</div>');
    document.querySelectorAll('.myr[data-id]').forEach(el => el.onclick = () => go('report/' + el.dataset.id));
  } catch (e) { document.getElementById('mine').innerHTML = `<div class="danger-note">${esc(e.message)}</div>`; }
}

function resetDraft() { Object.assign(draft, { category: null, files: [], description: '', answers: {}, audio: null, loc: null, locInfo: null, source: 'app' }); startGps(); }

function emergencySheet() {
  render(`${appbar('بلاغ طوارئ', true)}<div class="pad stack">
    <div class="danger-note" style="font-size:15px"><b>لو في خطر على حياة حد، اتصل فوراً:</b></div>

function steps(n) { return `<div class="steps">${[1, 2, 3].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</div>`; }
function step1() {
  render(`${appbar('بلاغ جديد', true)}${steps(1)}<div class="pad"><h3 style="margin:4px 0 12px;font-size:17px">إيه نوع المشكلة؟</h3>

// ---------- step 2: media + description ----------
function step2() {
  if (!draft.category) return go('new');
  const cat = M.categories.find(c => c.code === draft.category);
  const hasVideo = draft.files.some(f => f.type.startsWith('video'));
  render(`${appbar(cat.ar, true)}${steps(2)}<div class="pad stack">
    <div><h3 style="margin:4px 0 4px;font-size:17px">صوّر المشكلة</h3><div class="muted small">حتى 5 صور أو فيديو واحد (5 دقائق بحد أقصى)</div></div>
    <div class="thumbs" id="thumbs"></div>
    <div class="addmedia">
      <label>${icon('camera')} التقط صورة<input type="file" accept="image/*" capture="environment" data-src="camera" ${hasVideo ? 'disabled' : ''}></label>
      <label>${icon('image')} من المعرض<input type="file" accept="image/*" multiple data-src="gallery" ${hasVideo ? 'disabled' : ''}></label>
      <label>${icon('video')} فيديو<input type="file" accept="video/*" capture="environment" data-src="video" ${draft.files.length ? 'disabled' : ''}></label>
    </div>
    ${cat.questions.length ? `<div class="stack">${cat.questions.map((q, i) => `<label class="field"><span>${esc(q)}</span><input class="input" data-q="${i}" value="${esc(draft.answers[q] || '')}"></label>`).join('')}</div>` : ''}
    <label class="field"><span>وصف المشكلة</span><textarea class="input" id="desc" placeholder="اكتب وصف مختصر للمشكلة…">${esc(draft.description)}</textarea></label>
    <div class="card" style="padding:12px"><div class="rec" id="rec"><button class="btn secondary sm" id="recBtn">${icon('mic', 16)} ${draft.audio ? 'إعادة التسجيل' : 'وصف صوتي'}</button><span class="small muted" id="recTxt">${draft.audio ? 'تم تسجيل وصف صوتي ✓' : 'بدل الكتابة — حد أقصى دقيقتين'}</span></div>${draft.audio ? `<audio controls src="${URL.createObjectURL(draft.audio)}" style="width:100%;margin-top:8px"></audio>` : ''}</div>
  </div><div class="footer-cta"><button class="btn lg block" id="next">التالي: تأكيد الموقع</button></div>`);
  renderThumbs();
  $app.querySelectorAll('.addmedia input').forEach(inp => inp.onchange = () => addFiles([...inp.files], inp.dataset.src));
  const saveText = () => { draft.description = document.getElementById('desc').value; $app.querySelectorAll('[data-q]').forEach(i => draft.answers[cat.questions[i.dataset.q]] = i.value); };
  document.getElementById('desc').oninput = saveText;
  $app.querySelectorAll('[data-q]').forEach(i => i.oninput = saveText);
  document.getElementById('recBtn').onclick = recordVoice;
  document.getElementById('next').onclick = () => {
    saveText();
    if (!draft.files.length && !draft.audio && !draft.description.trim()) return toast('ضيف صورة أو وصف للمشكلة', 'err');
    go('location');
  };
}
function addFiles(files, src) {
  for (const f of files) {
    if (f.type.startsWith('video')) {
      if (draft.files.length) { toast('الفيديو لوحده بس — من غير صور', 'err'); continue; }
      const v = document.createElement('video'); v.preload = 'metadata'; v.src = URL.createObjectURL(f);
      v.onloadedmetadata = () => { if (v.duration > 300) { toast('مدة الفيديو أكثر من 5 دقائق', 'err'); draft.files = draft.files.filter(x => x.file !== f); renderThumbs(); } };
      draft.files.push({ file: f, type: f.type, fromGallery: false });
    } else {
      if (draft.files.filter(x => x.type.startsWith('image')).length >= 5) { toast('الحد الأقصى 5 صور', 'err'); break; }
      draft.files.push({ file: f, type: f.type, fromGallery: src === 'gallery', exifTakenAt: src === 'gallery' ? f.lastModified : null });
    }
  }
  step2();
}
function renderThumbs() {
  const box = document.getElementById('thumbs');
  box.innerHTML = draft.files.map((f, i) => `<div class="th">${f.type.startsWith('video') ? `<video src="${URL.createObjectURL(f.file)}" muted></video>` : `<img src="${URL.createObjectURL(f.file)}" alt="">`}<button data-rm="${i}" aria-label="حذف">${icon('x', 14)}</button>${f.fromGallery ? '<span class="g">من المعرض</span>' : ''}</div>`).join('');
  box.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { draft.files.splice(Number(b.dataset.rm), 1); step2(); });
}
let recorder = null;
async function recordVoice() {
  const btn = document.getElementById('recBtn'), txt = document.getElementById('recTxt');
  if (recorder) { recorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => { stream.getTracks().forEach(t => t.stop()); draft.audio = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' }); recorder = null; step2(); };
    recorder.start();
    btn.innerHTML = `${icon('check', 16)} إيقاف`; txt.innerHTML = '<span class="dotrec"></span> جاري التسجيل…';
    setTimeout(() => recorder?.state === 'recording' && recorder.stop(), 120000);
  } catch { toast('مش قادر أوصل للميكروفون', 'err'); }
}

// Test location inside the pilot area (بني صالح، زاوية الكرادسة، السيليين)
async function demoLocation() {
  const g = await api('/api/geo');
  const pilot = M.settings.pilotUnits || [];
  const vs = g.villages.features.filter(f => pilot.includes(f.properties.unitId));
  const pool = vs.length ? vs : g.villages.features.filter(f => f.properties.kind === 'قرية');
  const v = pool[Math.floor(Math.random() * pool.length)].properties;
  let lng = v.lng, lat = v.lat;
  for (let i = 0; i < 8; i++) { // jitter around the village but stay inside its unit
    const x = v.lng + (Math.random() - 0.5) * 0.008, y = v.lat + (Math.random() - 0.5) * 0.008;
    const info = await api(`/api/locate?lng=${x}&lat=${y}`);
    if (info.unit && info.unit.id === v.unitId) { lng = x; lat = y; break; }
  }
  setLoc(lng, lat, 'gps', 8);
}
async function setLoc(lng, lat, source, accuracy) {
  draft.loc = { lng, lat, source, accuracy };
  marker.setLngLat([lng, lat]).addTo(pickMap);
  pickMap.easeTo({ center: [lng, lat], zoom: Math.max(pickMap.getZoom(), 14) });
  const box = document.getElementById('locInfo'), btn = document.getElementById('send');
  try {
    const info = await api(`/api/locate?lng=${lng}&lat=${lat}`);
    draft.locInfo = info;
    if (!info.inside) { box.className = 'locbox bad'; box.innerHTML = `${icon('alert')}<div><b>الموقع خارج محافظة الفيوم</b><div class="small">حدّد مكان المشكلة داخل المحافظة، أو جرّب «موقع تجريبي».</div></div>`; btn.disabled = true; return; }
    box.className = 'locbox ok';
    box.innerHTML = info.unit
      ? `${icon('pin')}<div><b>${esc(info.village.name)} — ${esc(info.center.name)}</b><div class="small">البلاغ هيروح تلقائياً إلى: <b>${esc(info.unit.name)}</b></div><div class="tiny muted num">${lat.toFixed(5)}, ${lng.toFixed(5)}${accuracy ? ` · دقة ±${accuracy} م` : ''} · ${source === 'gps' ? 'GPS' : 'تحديد يدوي'}</div></div>`
      : `${icon('pin')}<div><b>${esc(info.noUnitArea)}</b><div class="small">المنطقة دي مش تابعة لوحدة محلية — البلاغ هيروح لغرفة العمليات بالمحافظة.</div></div>`;
    btn.disabled = false;
  } catch (e) { box.className = 'locbox bad'; box.textContent = e.message; btn.disabled = true; }
}

// Watermark: date, time, coordinates, report brand — burned into the photo
async function watermark(file, loc) {
  const img = await createImageBitmap(file);
  const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0, c.width, c.height);
  const h = Math.max(46, c.height * 0.075);
  g.fillStyle = 'rgba(14,21,17,.62)'; g.fillRect(0, c.height - h, c.width, h);
  g.fillStyle = '#fff'; g.font = `600 ${Math.round(h * 0.34)}px "Readex Pro", Tahoma, sans-serif`; g.textBaseline = 'middle';
  g.direction = 'ltr'; g.textAlign = 'left';
  g.fillText(`${new Date().toLocaleString('en-GB')}  |  ${loc.lat.toFixed(5)}, ${loc.lng.toFixed(5)}`, h * 0.35, c.height - h / 2);
  g.direction = 'rtl'; g.textAlign = 'right'; g.fillStyle = '#F4A21D';
  g.fillText('بلّغ', c.width - h * 0.35, c.height - h / 2);
  return new Promise(r => c.toBlob(b => r(new File([b], 'photo.jpg', { type: 'image/jpeg' })), 'image/jpeg', 0.82));
}

async function buildForm() {
  const fd = new FormData();
  fd.append('category', draft.category); fd.append('description', draft.description);
  fd.append('guidedAnswers', JSON.stringify(draft.answers));
  fd.append('lng', draft.loc.lng); fd.append('lat', draft.loc.lat);
  if (draft.loc.accuracy) fd.append('accuracy', draft.loc.accuracy);
  fd.append('locationSource', draft.loc.source);
  fd.append('source', draft.source || 'app');
  const metaArr = [];
  for (const f of draft.files) {
    if (f.type.startsWith('image')) { fd.append('media', await watermark(f.file, draft.loc)); metaArr.push({ fromGallery: f.fromGallery, exifTakenAt: f.exifTakenAt, watermarked: true }); }
    else { fd.append('media', f.file); metaArr.push({ fromGallery: f.fromGallery }); }
  }
  if (draft.audio) fd.append('media', new File([draft.audio], 'voice.webm', { type: draft.audio.type || 'audio/webm' }));
  fd.append('mediaMeta', JSON.stringify(metaArr));
  return fd;
}

async function submit() {
  const btn = document.getElementById('send'); btn.disabled = true; btn.textContent = 'جاري الإرسال…';
  if (!navigator.onLine) { await enqueue(); toast('اتحفظ البلاغ — هيتبعت أول ما النت يرجع', 'ok'); return go(''); }
  try {
    const out = await api('/api/reports', { method: 'POST', form: await buildForm() });
    sessionStorage.setItem('ballegh:last', JSON.stringify(out));
    go('done');
  } catch (e) { toast(e.message, 'err'); btn.disabled = false; btn.textContent = 'إرسال البلاغ'; }
}

// ---------- offline queue (photos kept as data URLs) ----------
const getQueue = () => { try { return JSON.parse(localStorage.getItem(QUEUE_KEY)) || []; } catch { return []; } };
const toDataUrl = blob => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
async function enqueue() {
  const photos = [];
  for (const f of draft.files.filter(f => f.type.startsWith('image'))) photos.push({ data: await toDataUrl(await watermark(f.file, draft.loc)), fromGallery: f.fromGallery });
  const q = getQueue(); q.push({ category: draft.category, description: draft.description, answers: draft.answers, loc: draft.loc, photos, source: draft.source || 'app', createdOfflineAt: Date.now() });
  try { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); } catch { toast('مساحة التخزين ممتلئة', 'err'); }
}
async function flushQueue() {
  const q = getQueue(); if (!q.length || !navigator.onLine || !user) return;
  const left = [];
  for (const item of q) {
    try {
      const fd = new FormData();
      fd.append('category', item.category); fd.append('description', item.description); fd.append('guidedAnswers', JSON.stringify(item.answers));
      fd.append('lng', item.loc.lng); fd.append('lat', item.loc.lat); fd.append('locationSource', item.loc.source);
      if (item.source) fd.append('source', item.source);
      for (const p of item.photos) fd.append('media', await (await fetch(p.data)).blob(), 'photo.jpg');
      fd.append('mediaMeta', JSON.stringify(item.photos.map(p => ({ fromGallery: p.fromGallery, watermarked: true, createdOfflineAt: item.createdOfflineAt }))));
      await api('/api/reports', { method: 'POST', form: fd });
    } catch { left.push(item); }
  }
  localStorage.setItem(QUEUE_KEY, JSON.stringify(left));
  if (left.length < q.length) { toast(`تم إرسال ${q.length - left.length} بلاغ محفوظ`, 'ok'); if (!location.hash || location.hash === '#') home(); }
}
const netState = () => { document.getElementById('offline').classList.toggle('hidden', navigator.onLine); if (navigator.onLine) flushQueue(); };
window.addEventListener('online', netState); window.addEventListener('offline', netState);

// ---------- guided chat: «بلّغ بالمحادثة» ----------
// Same report as the step-by-step form (same draft, buildForm, watermark, offline queue), asked as a conversation.
// No AI: free text is matched against each category's keywords (editable in the CMS) and the citizen confirms.
const STOP = Symbol('chat-stopped');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const $c = id => document.getElementById(id);
const catObj = code => M.categories.find(c => c.code === code);
const normAr = s => String(s || '').toLowerCase().replace(/[ً-ْـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/\s+/g, ' ').trim();
function classify(text) {
  const t = ` ${normAr(text)} `;
  return M.categories.filter(c => c.active !== false && c.code !== 'other').map(c => {
    let s = 0;
    for (const k of c.keywords || []) { const nk = normAr(k); if (nk && t.includes(nk)) s += nk.split(' ').length + 1; }
    return { c, s };
  }).filter(x => x.s > 0).sort((a, b) => b.s - a.s).map(x => x.c);
}
let chat = null;
let chatContent = null;

function chatScreen() {
  render(`${appbar('مساعد البلاغات', true)}<div class="chatwrap">
    <div class="chatlog" id="clog" aria-live="polite"></div>
    <div class="chatbar">
      <button class="cb" id="cMic" aria-label="تسجيل صوت">${icon('mic', 20)}</button>
      <input id="cIn" placeholder="اكتب رسالتك…" autocomplete="off" enterkeyhint="send">
      <button class="cb send" id="cSend" aria-label="إرسال">${icon('send', 20)}</button>
    </div>
    <input type="file" id="cCam" accept="image/*" capture="environment" hidden>
    <input type="file" id="cGal" accept="image/*" multiple hidden>
    <input type="file" id="cVid" accept="video/*" capture="environment" hidden>
  </div>`);
  if (chat) chat.alive = false;
  chat = { alive: true, resolve: null, textOk: false, myIds: new Set() };
  $c('cSend').onclick = sendText;
  $c('cIn').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendText(); } });
  $c('cMic').onclick = micClick;
  api('/api/reports').then(l => l.forEach(r => chat.myIds.add(r.id))).catch(() => {});
  runChat();
}
addEventListener('hashchange', () => { if (chat && location.hash !== '#chat') chat.alive = false; });

function scrollEnd() { const l = $c('clog'); if (l) l.scrollTop = l.scrollHeight; }
async function bot(html, delay = 450) {
  if (!chat?.alive) throw STOP;
  const log = $c('clog');
  const t = document.createElement('div');
  t.className = 'msg bot typing'; t.innerHTML = '<i></i><i></i><i></i>';
  log.appendChild(t); scrollEnd();
  await sleep(delay);
  if (!chat?.alive) throw STOP;
  t.className = 'msg bot'; t.innerHTML = html; scrollEnd();
  return t;
}
function me(html) { const d = document.createElement('div'); d.className = 'msg me'; d.innerHTML = html; $c('clog').appendChild(d); scrollEnd(); }

// Show quick-reply chips and wait for a chip, typed text or a voice note
function ask(chips = [], { text = true } = {}) {
  if (!chat?.alive) return Promise.reject(STOP);
  return new Promise(res => {
    const log = $c('clog');
    log.querySelectorAll('.chips').forEach(c => c.remove());
    const box = document.createElement('div');
    box.className = 'chips';
    chips.forEach(ch => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = `chip ${ch.cls || ''}`; b.textContent = ch.label;
      b.onclick = () => { if (!chat.resolve) return; me(esc(ch.label)); chat.resolve({ type: 'chip', value: ch.value }); };
      box.appendChild(b);
    });
    if (chips.length) log.appendChild(box);
    chat.textOk = text;
    const inp = $c('cIn');
    inp.disabled = !text; $c('cMic').disabled = !text; $c('cSend').disabled = !text;
    inp.placeholder = text ? 'اكتب رسالتك… أو اضغط 🎤' : 'اختار من الأزرار اللي فوق 👆';
    if (text && matchMedia('(pointer:fine)').matches) inp.focus();
    scrollEnd();
    chat.resolve = v => { chat.resolve = null; box.remove(); res(v); };
  });
}
function sendText() {
  const inp = $c('cIn'); const v = inp.value.trim();
  if (!v || !chat?.resolve) return;
  if (!chat.textOk) { toast('اختار من الأزرار اللي فوق 👆'); return; }
  inp.value = ''; me(esc(v));
  chat.resolve({ type: 'text', value: v });
}

// Voice: browser speech-to-text (Chrome/Edge/Android) → text; elsewhere a recorded voice note
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let srec = null, vrec = null;
async function micClick() {
  if (!chat?.resolve || !chat.textOk) return;
  const btn = $c('cMic'), inp = $c('cIn');
  if (SR) {
    if (srec) { srec.stop(); return; }
    srec = new SR(); srec.lang = 'ar-EG'; srec.interimResults = true; srec.maxAlternatives = 1;
    btn.classList.add('rec'); inp.placeholder = 'بسمعك… اتكلم 🎙';
    srec.onresult = e => { let t = ''; for (const r of e.results) t += r[0].transcript; inp.value = t; };
    srec.onerror = e => toast(e.error === 'not-allowed' ? 'اسمح للمتصفح باستخدام الميكروفون' : 'مقدرتش أسمعك كويس — جرّب تاني أو اكتب', 'err');
    srec.onend = () => { btn.classList.remove('rec'); srec = null; inp.placeholder = 'اكتب رسالتك… أو اضغط 🎤'; if (inp.value.trim()) sendText(); };
    try { srec.start(); } catch { btn.classList.remove('rec'); srec = null; }
    return;
  }
  if (vrec) { vrec.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = [];
    vrec = new MediaRecorder(stream);
    vrec.ondataavailable = e => chunks.push(e.data);
    vrec.onstop = () => {
      stream.getTracks().forEach(t => t.stop()); btn.classList.remove('rec');
      draft.audio = new Blob(chunks, { type: vrec.mimeType || 'audio/webm' }); vrec = null;
      if (!chat?.resolve) return;
      me(`🎤 رسالة صوتية<audio controls src="${URL.createObjectURL(draft.audio)}"></audio>`);
      chat.resolve({ type: 'voice' });
    };
    vrec.start(); btn.classList.add('rec'); inp.placeholder = 'بيسجّل… اضغط تاني للإيقاف';
    setTimeout(() => vrec?.state === 'recording' && vrec.stop(), 120000);
  } catch { toast('مش قادر أوصل للميكروفون', 'err'); }
}

function emergencyHtml() {
  const list = chatContent?.emergency?.length ? chatContent.emergency : [{ name: 'الحماية المدنية', number: '180' }, { name: 'الإسعاف', number: '123' }, { name: 'شرطة النجدة', number: '122' }];
  return `<b style="color:#B91C1C">⚠️ لو فيه خطر على حياة حد، اتصل فوراً:</b><div class="emgl">${list.map(e => `<a href="tel:${esc(e.number)}">${esc(e.name)} <b class="num">${esc(e.number)}</b></a>`).join('')}</div><span class="tiny muted">وأنا هكمّل معاك البلاغ علشان يوصل لغرفة العمليات والمحافظ فوراً.</span>`;
}

const TOP_CATS = ['garbage', 'sewage', 'water', 'lighting', 'roads', 'agri_encroach'];
async function pickAnyCat(prompt = 'اختار نوع المشكلة:') {
  await bot(prompt, 250);
  const a = await ask(M.categories.filter(c => c.active !== false).map(c => ({ label: c.ar, value: c.code, cls: c.emergency ? 'danger' : '' })), { text: false });
  return catObj(a.value);
}
async function chatCategory() {
  await bot('قولي إيه المشكلة؟ اكتب أو اتكلم 🎤 — أو اختار من تحت:');
  const a = await ask([...TOP_CATS.filter(catObj).map(c => ({ label: catAr(c), value: 'cat:' + c })), { label: 'حاجة تانية…', value: 'more' }]);
  if (a.type === 'chip') return a.value === 'more' ? pickAnyCat() : catObj(a.value.slice(4));
  if (a.type === 'voice') return pickAnyCat('وصلني تسجيلك الصوتي 👍 وهيتبعت مع البلاغ. اختار نوع المشكلة:');
  draft.description = a.value;
  const found = classify(a.value);
  if (found.some(c => c.emergency)) await bot(emergencyHtml(), 300);
  if (!found.length) return pickAnyCat('مقدرتش أحدد نوع المشكلة من الكلام 🙏 اختار النوع من القائمة:');
  await bot(`فهمت إنها <b>${esc(found[0].ar)}</b>، صح؟`);
  const b = await ask([{ label: 'أيوه ✅', value: 'yes', cls: 'primary' }, ...(found[1] ? [{ label: found[1].ar, value: found[1].code }] : []), { label: 'لأ، أختار النوع', value: 'more' }], { text: false });
  if (b.value === 'yes') return found[0];
  if (b.value === 'more') return pickAnyCat();
  return catObj(b.value);
}

function pickFiles(id) {
  return new Promise(res => {
    const inp = $c(id); inp.value = '';
    let done = false;
    const finish = files => { if (done) return; done = true; res(files); };
    inp.onchange = () => finish([...inp.files]);
    inp.oncancel = () => finish([]);
    addEventListener('focus', function f() { removeEventListener('focus', f); setTimeout(() => finish([...inp.files]), 700); });
    inp.click();
  });
}
async function chatMedia() {
  await bot('ممكن تصوّر المشكلة؟ الصورة بتساعد الوحدة تتحرك أسرع 📷');
  for (;;) {
    const imgs = draft.files.filter(f => f.type.startsWith('image')).length;
    const hasVid = draft.files.some(f => f.type.startsWith('video'));
    if (hasVid || imgs >= 5) break;
    const chips = [{ label: '📷 كاميرا', value: 'cCam' }, { label: '🖼 من المعرض', value: 'cGal' }];
    if (!draft.files.length) chips.push({ label: '🎥 فيديو', value: 'cVid' });
    chips.push(draft.files.length ? { label: 'كده تمام ✅', value: 'done', cls: 'primary' } : { label: 'تخطّي', value: 'done' });
    const a = await ask(chips, { text: false });
    if (a.value === 'done') break;
    const files = await pickFiles(a.value);
    if (!files.length) { await bot('محصلش اختيار — تحب تجرب تاني؟', 200); continue; }
    const before = draft.files.length;
    for (const f of files) {
      if (f.type.startsWith('video')) {
        if (draft.files.length) { await bot('الفيديو بيتبعت لوحده من غير صور 🙏', 200); continue; }
        const ok = await new Promise(r => { const v = document.createElement('video'); v.preload = 'metadata'; v.onloadedmetadata = () => r(v.duration <= 300); v.onerror = () => r(true); v.src = URL.createObjectURL(f); });
        if (!ok) { await bot('مدة الفيديو أكتر من 5 دقايق 🙏', 200); continue; }
        draft.files.push({ file: f, type: f.type, fromGallery: false });
      } else if (draft.files.filter(x => x.type.startsWith('image')).length < 5) {
        draft.files.push({ file: f, type: f.type, fromGallery: a.value === 'cGal', exifTakenAt: a.value === 'cGal' ? f.lastModified : null });
      }
    }
    const added = draft.files.slice(before);
    if (!added.length) continue;
    me(`<div class="mthumbs">${added.map(f => f.type.startsWith('video') ? `<video src="${URL.createObjectURL(f.file)}" muted></video>` : `<img src="${URL.createObjectURL(f.file)}" alt="">`).join('')}</div>`);
    const n = draft.files.filter(f => f.type.startsWith('image')).length;
    await bot(draft.files.some(f => f.type.startsWith('video')) ? 'وصل الفيديو 👍' : `وصلت ${n === 1 ? 'الصورة' : n + ' صور'} 👍${n < 5 ? ' تحب تضيف كمان؟' : ''}`, 300);
  }
}

function getGps() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('no-geo'));
    navigator.geolocation.getCurrentPosition(p => res({ lng: p.coords.longitude, lat: p.coords.latitude, accuracy: Math.round(p.coords.accuracy), source: 'gps' }), rej, { enableHighAccuracy: true, timeout: 12000 });
  });
}
async function chatDemoPoint() {
  const g = await api('/api/geo');
  const pilot = M.settings.pilotUnits || [];
  const vs = g.villages.features.filter(f => pilot.includes(f.properties.unitId));
  const pool = vs.length ? vs : g.villages.features.filter(f => f.properties.kind === 'قرية');
  const v = pool[Math.floor(Math.random() * pool.length)].properties;
  for (let i = 0; i < 8; i++) {
    const x = v.lng + (Math.random() - 0.5) * 0.008, y = v.lat + (Math.random() - 0.5) * 0.008;
    const info = await api(`/api/locate?lng=${x}&lat=${y}`);
    if (info.unit && info.unit.id === v.unitId) return { lng: x, lat: y, accuracy: 8, source: 'gps' };
  }
  return { lng: v.lng, lat: v.lat, accuracy: 8, source: 'gps' };
}
function mapSheet() {
  return new Promise(res => {
    const sh = document.createElement('div');
    sh.className = 'sheet';
    sh.innerHTML = `<div class="sh"><div class="row"><b>اضغط على مكان المشكلة</b><span class="spacer"></span><button class="icon-btn" data-x aria-label="إلغاء">${icon('x', 18)}</button></div><div id="smap"></div><button class="btn lg block" id="sOk" disabled>تأكيد المكان</button></div>`;
    document.querySelector('.device').appendChild(sh);
    let picked = null, mk = null;
    const close = v => { sh.remove(); res(v); };
    sh.querySelector('[data-x]').onclick = () => close(null);
    sh.querySelector('#sOk').onclick = () => close(picked);
    try {
      const m = createMap('smap', { zoom: 10 });
      m.on('click', e => {
        picked = { lng: e.lngLat.lng, lat: e.lngLat.lat, source: 'manual' };
        mk = mk || new maplibregl.Marker({ color: '#187535' });
        mk.setLngLat([picked.lng, picked.lat]).addTo(m);
        sh.querySelector('#sOk').disabled = false;
      });
    } catch { toast('الخريطة مش متاحة دلوقتي', 'err'); close(null); }
  });
}
async function chatLocation() {
  await bot('إنت دلوقتي في مكان المشكلة؟');
  for (;;) {
    const a = await ask([{ label: '📍 أيوه، خد موقعي', value: 'gps', cls: 'primary' }, { label: '🗺 أحدده على الخريطة', value: 'map' }, { label: '🧪 موقع تجريبي', value: 'demo' }], { text: false });
    let loc = null;
    if (a.value === 'gps') loc = await getGps().catch(() => null);
    if (a.value === 'demo') loc = await chatDemoPoint().catch(() => null);
    if (a.value === 'map') loc = await mapSheet();
    if (!loc) { await bot(a.value === 'gps' ? 'مقدرتش أوصل لموقعك 😕 شغّل الـ GPS، أو حدده على الخريطة.' : 'متحددش مكان. نجرب تاني؟', 250); continue; }
    const info = await api(`/api/locate?lng=${loc.lng}&lat=${loc.lat}`);
    if (!info.inside) { await bot('المكان ده خارج محافظة الفيوم 🙏 حدد مكان المشكلة جوه المحافظة.', 250); continue; }
    draft.loc = loc; draft.locInfo = info;
    await bot(info.unit
      ? `📍 إنت في <b>${esc(info.village.name)}</b> — ${esc(info.center.name)}.<br>البلاغ هيروح لـ <b>${esc(info.unit.name)}</b>.`
      : `📍 المكان ده (<b>${esc(info.noUnitArea)}</b>) بيتبع المحافظة مباشرة — البلاغ هيروح لغرفة العمليات.`, 300);
    return;
  }
}
async function chatNearby() {
  try {
    const n = await api(`/api/nearby?lng=${draft.loc.lng}&lat=${draft.loc.lat}&category=${encodeURIComponent(draft.category)}`);
    if (n.found) await bot(`🔁 فيه بلاغ عن نفس المشكلة اتقدّم ${n.daysAgo === 0 ? 'النهارده' : n.daysAgo === 1 ? 'امبارح' : `من ${n.daysAgo} أيام`} على بعد ${n.distanceM} متر (وصله ${n.count} ${n.count > 1 ? 'بلاغات' : 'بلاغ'}).<br>بلاغك هيتضم ليه، وده بيرفع أولويته 👍`, 300);
  } catch {}
}
function summaryHtml() {
  const c = catObj(draft.category);
  const ans = Object.entries(draft.answers).filter(([, v]) => v);
  const thumbs = draft.files.slice(0, 5).map(f => f.type.startsWith('video') ? '<span class="vt">🎥</span>' : `<img src="${URL.createObjectURL(f.file)}" alt="">`).join('');
  const where = draft.locInfo?.unit ? `${esc(draft.locInfo.village.name)} ← ${esc(draft.locInfo.unit.name)}` : esc(draft.locInfo?.noUnitArea || '');
  return `<div class="sumcard"><div class="st">ملخص بلاغك</div>
    <div class="sr"><span>🗂</span><b>${esc(c?.ar || '')}</b></div>
    ${draft.description ? `<div class="sr"><span>📝</span><span>${esc(draft.description)}</span></div>` : ''}
    ${ans.map(([q, v]) => `<div class="sr"><span>❔</span><span>${esc(q)} <b>${esc(v)}</b></span></div>`).join('')}
    ${draft.audio ? '<div class="sr"><span>🎤</span><span>وصف صوتي مرفق</span></div>' : ''}
    <div class="sr"><span>📷</span><span>${draft.files.length ? `${draft.files.length} ${draft.files.some(f => f.type.startsWith('video')) ? 'فيديو' : draft.files.length > 1 ? 'صور' : 'صورة'}` : 'من غير صور'}</span></div>
    ${thumbs ? `<div class="mthumbs sm">${thumbs}</div>` : ''}
    <div class="sr"><span>📍</span><span>${where}</span></div></div>`;
}
async function chatSummary() {
  for (;;) {
    await bot(summaryHtml(), 350);
    const a = await ask([{ label: '✅ إرسال', value: 'send', cls: 'primary' }, { label: '✏️ النوع', value: 'cat' }, { label: '✏️ الوصف', value: 'desc' }, { label: '📍 الموقع', value: 'loc' }], { text: false });
    if (a.value === 'send') return chatSubmit();
    if (a.value === 'cat') draft.category = (await pickAnyCat()).code;
    if (a.value === 'desc') { await bot('اكتب الوصف الجديد (أو سجّل صوت 🎤):', 250); const d = await ask([]); if (d.type === 'text') draft.description = d.value; }
    if (a.value === 'loc') { await chatLocation(); await chatNearby(); }
  }
}
async function chatSubmit() {
  const typing = await bot('جاري الإرسال…', 150);
  if (!navigator.onLine) {
    await enqueue();
    typing.innerHTML = 'مفيش إنترنت دلوقتي 📶 اتحفظ البلاغ على الموبايل وهيتبعت لوحده أول ما النت يرجع.';
    return chatEnd();
  }
  try {
    const out = await api('/api/reports', { method: 'POST', form: await buildForm() });
    chat.myIds.add(out.id);
    typing.innerHTML = `اتبعت ✅<br>رقم بلاغك: <b class="num" dir="ltr">${esc(out.code)}</b><br>${out.duplicateOf ? 'اتضم لبلاغ سابق عن نفس المشكلة.' : out.unitName ? `وصل لـ <b>${esc(out.unitName)}</b>.` : 'وصل لغرفة العمليات بالمحافظة.'}<br><span class="tiny muted">هبعتلك هنا أول ما يحصل أي تحديث على بلاغك.</span>`;
    scrollEnd();
  } catch (e) {
    typing.innerHTML = `حصلت مشكلة: ${esc(e.message)}`;
    const a = await ask([{ label: '🔁 حاول تاني', value: 'retry', cls: 'primary' }, { label: '🏠 الرئيسية', value: 'home' }], { text: false });
    if (a.value === 'retry') return chatSubmit();
    return go('');
  }
  return chatEnd();
}
async function chatMine() {
  const list = (await api('/api/reports')).slice(0, 5);
  await bot(list.length ? `آخر بلاغاتك:<div class="mylist">${list.map(r => `<a href="#report/${r.id}"><b>${esc(catAr(r.category))}</b> ${statusBadge(r.status)}<span class="tiny muted num" dir="ltr">${esc(r.code)}</span></a>`).join('')}</div>` : 'لسه مقدمتش بلاغات.', 300);
}
async function chatEnd() {
  for (;;) {
    const a = await ask([{ label: '➕ بلاغ تاني', value: 'again', cls: 'primary' }, { label: '📋 بلاغاتي', value: 'mine' }, { label: '🏠 الرئيسية', value: 'home' }], { text: false });
    if (a.value === 'home') return go('');
    if (a.value === 'mine') { await chatMine(); continue; }
    const sep = document.createElement('div'); sep.className = 'csep'; sep.textContent = 'بلاغ جديد'; $c('clog').appendChild(sep);
    return runChat(true);
  }
}
function chatNotify(r) {
  if (!chat?.alive || !chat.myIds.has(r.id)) return;
  const msg = { ACKNOWLEDGED: 'الوحدة المحلية استلمت بلاغك 👀', RESOLVED: 'الوحدة بتقول إن المشكلة اتحلت ✅ قيّم الحل', CLOSED: 'البلاغ اتقفل' }[r.status];
  if (!msg) return;
  bot(`📣 <b class="num" dir="ltr">${esc(r.code)}</b><br>${msg}${r.status === 'RESOLVED' ? `<br><a href="#report/${r.id}">افتح البلاغ وقيّم ←</a>` : ''}`, 300).catch(() => {});
}

async function runChat(again = false) {
  resetDraft(); draft.source = 'chat';
  try {
    if (!chatContent) chatContent = await api('/api/content').catch(() => ({}));
    if (!again) await bot(`أهلاً يا <b>${esc((user.name || '').split(' ')[0] || 'فندم')}</b> 👋 أنا مساعد «بلّغ»، وهساعدك تبلّغ عن أي مشكلة في منطقتك.`, 300);
    const c = await chatCategory();
    draft.category = c.code;
    if (c.emergency && !draft.description) await bot(emergencyHtml(), 300);
    for (const q of c.questions || []) {
      await bot(esc(q), 350);
      const a = await ask([{ label: 'تخطّي', value: 'skip' }]);
      if (a.type === 'text') draft.answers[q] = a.value;
    }
    if (!draft.description && !draft.audio) {
      await bot('اوصفلي المشكلة في جملة أو اتنين (أو سجّل صوت 🎤):', 350);
      const a = await ask([{ label: 'تخطّي', value: 'skip' }]);
      if (a.type === 'text') draft.description = a.value;
    }
    await chatMedia();
    await chatLocation();
    await chatNearby();
    await chatSummary();
  } catch (e) {
    if (e !== STOP) { console.error(e); bot(`حصلت مشكلة غير متوقعة: ${esc(e.message || e)}`, 100).catch(() => {}); }
  }
}

async function refreshBadge() { try { setBadge((await api('/api/notifications')).unread); } catch {} }

// ---- Web Push: service worker + subscription (no external service; VAPID keys live on our server) ----
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && window.isSecureContext;
let swReg = null;
async function getReg() { if (!swReg) swReg = await navigator.serviceWorker.register('/sw.js'); await navigator.serviceWorker.ready; return swReg; }
const b64ToBytes = b64 => { const p = '='.repeat((4 - b64.length % 4) % 4); const raw = atob((b64 + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(raw, c => c.charCodeAt(0)); };
async function pushState() {
  if (!pushSupported()) return 'unsupported';
  if (Notification.permission === 'denied') return 'denied';
  try { const reg = await getReg(); return (await reg.pushManager.getSubscription()) ? 'on' : 'off'; } catch { return 'off'; }
}
async function enablePush() {
  if (!pushSupported()) { toast('المتصفح ده مش بيدعم الإشعارات. على آيفون: ضيف «بلّغ» للشاشة الرئيسية الأول', 'err'); return false; }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') { toast('الإشعارات مش مسموحة — تقدر تفعّلها من إعدادات المتصفح', 'err'); return false; }
  const reg = await getReg();
  const { publicKey } = await api('/api/push/key');
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(publicKey) });
  await api('/api/push/subscribe', { method: 'POST', body: { subscription: sub.toJSON() } });
  toast('تم تفعيل الإشعارات على الجهاز ده ✓', 'ok');
  return true;
}
async function disablePush() {
  try { const reg = await getReg(); const sub = await reg.pushManager.getSubscription(); if (sub) { await api('/api/push/unsubscribe', { method: 'POST', body: { endpoint: sub.endpoint } }); await sub.unsubscribe(); } } catch {}
  toast('تم إيقاف الإشعارات على الجهاز ده');
}
async function pushPrompt() {
  const slot = document.getElementById('pushSlot');
  if (!slot || (await pushState()) !== 'off') return;
  try { if (localStorage.getItem('ballegh:pushLater') > Date.now()) return; } catch {}
  if (!document.getElementById('pushSlot')) return;
  slot.innerHTML = `<div class="pushcard">${icon('bell', 20)}<div class="small"><b>فعّل الإشعارات</b><div class="muted">علشان يوصلك جديد بلاغاتك حتى والتطبيق مقفول</div></div><span class="spacer"></span><button class="btn sm" id="pOn">تفعيل</button><button class="btn ghost sm" id="pLater" aria-label="بعدين">✕</button></div>`;
  slot.querySelector('#pOn').onclick = async () => { if (await enablePush().catch(e => toast(e.message, 'err'))) slot.innerHTML = ''; };
  slot.querySelector('#pLater').onclick = () => { try { localStorage.setItem('ballegh:pushLater', Date.now() + 3 * 86_400_000); } catch {} slot.innerHTML = ''; };
}

async function settingsScreen() {
  render(`${appbar('إعدادات الإشعارات', true)}<div class="pad stack"><div class="muted small">جاري التحميل…</div></div>`);
  const [mine, geo, ps] = await Promise.all([api('/api/me'), api('/api/geo'), pushState()]);

  const pushTxt = { on: 'مفعّلة على الجهاز ده', off: 'مش مفعّلة على الجهاز ده', denied: 'محظورة من إعدادات المتصفح', unsupported: 'المتصفح ده مش بيدعمها' }[ps];
  const box = $app.querySelector('.pad');
  box.innerHTML = `
    <div class="card" style="padding:4px 14px">
      <label class="pref"><div><b>تحديثات بلاغاتي</b><div class="small muted">وصول البلاغ، استلام الوحدة، الحل، القفل، والضم لبلاغ مشابه</div></div><span class="switch"><input type="checkbox" id="pRep" ${p.reports ? 'checked' : ''}><i></i></span></label>
      <label class="pref"><div><b>إعلانات المحافظة</b><div class="small muted">انقطاع مياه أو كهرباء، أعمال صيانة، تنبيهات طقس في منطقتك</div></div><span class="switch"><input type="checkbox" id="pAnn" ${p.announcements ? 'checked' : ''}><i></i></span></label>
    </div>
    <label class="field"><span>منطقتي (علشان الإعلانات اللي تخصها توصلك)</span>
      <select class="input" id="pVil"><option value="">— مش محددة —</option>${centers.map(c => `<optgroup label="${esc(c.name)}">${vills.filter(v => v.centerId === c.id).sort((a, b) => a.name.localeCompare(b.name, 'ar')).map(v => `<option value="${v.id}" ${p.homeVillage === v.id ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}</optgroup>`).join('')}</select></label>
    <div class="card" style="padding:12px 14px"><div class="row"><div style="flex:1"><b>إشعارات الجهاز</b><div class="small muted">${pushTxt}</div></div>
      ${ps === 'on' ? '<button class="btn ghost sm" id="pOff">إيقاف</button>' : ps === 'off' ? '<button class="btn sm" id="pOn">تفعيل</button>' : ''}</div>
      <div class="tiny muted" style="margin-top:6px">حتى لو قفلتها، الإشعارات بتفضل موجودة جوه التطبيق تحت 🔔</div></div>
    <div class="hint small">بنبعتلك عن بلاغاتك إنت بس، ومحدش غيرك بيشوفها.</div>`;
  const patch = async body => { try { await api('/api/me', { method: 'PATCH', body }); toast('اتحفظ ✓', 'ok'); } catch (e) { toast(e.message, 'err'); } };
  box.querySelector('#pRep').onchange = e => patch({ reports: e.target.checked });
  box.querySelector('#pAnn').onchange = e => patch({ announcements: e.target.checked });
  box.querySelector('#pVil').onchange = e => patch({ homeVillage: e.target.value || null });
  box.querySelector('#pOn')?.addEventListener('click', async () => { if (await enablePush().catch(e => toast(e.message, 'err'))) settingsScreen(); });
  box.querySelector('#pOff')?.addEventListener('click', async () => { await disablePush(); settingsScreen(); });
}

sock.onload = () => {
  socket = io();

  socket.on('report:update', r => { const [n, a] = location.hash.slice(1).split('/'); if (n === 'chat') chatNotify(r); else if (n === 'report') reportScreen(a); else if (!n) home(); });

    if (!user || n.userId !== user.id) return;
    const here = location.hash.slice(1).split('/')[0];

  });
};
